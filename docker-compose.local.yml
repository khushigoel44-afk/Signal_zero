services:
  mongo:
    image: mongo:7
    container_name: ogtps-mongo
    ports:
      - "27017:27017"
    volumes:
      - ogtps_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: ogtps-ml
    environment:
      - MODEL_DIR=./model
      - SEED=42
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ogtps-backend
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/ogtps
      - ML_SERVICE_URL=http://ml:8000
      - CORS_ORIGIN=*
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ml:
        condition: service_started

volumes:
  ogtps_mongo_data:
